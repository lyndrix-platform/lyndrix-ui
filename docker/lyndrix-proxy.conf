# Shared reverse-proxy directives for the backend locations in default.conf.template.
# $core_upstream is set per-server from LYNDRIX_BACKEND_URL; using a variable in
# proxy_pass forces runtime DNS resolution via the configured resolver. With no URI
# part on proxy_pass, nginx forwards the original request URI unchanged
# (/api/... -> <backend>/api/..., /auth/callback/oidc -> <backend>/auth/callback/oidc).
proxy_pass $core_upstream;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Lets the backend learn its public host/scheme (e.g. to derive the OIDC redirect
# URI from the request instead of a hard-coded setting — see follow-up).
proxy_set_header X-Forwarded-Host  $host;

# Server-Sent Events / streaming (/api/events, iac job logs): keep the connection
# open, no buffering, long read timeout — otherwise live notifications/logs stall.
proxy_set_header Connection "";
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
chunked_transfer_encoding on;
